<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tradedesk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --card:#171a21; --fg:#e6e6e6; --dim:#8a8f98; --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c; --line:#262a33; --accent:#4d9eff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, Segoe UI, sans-serif; font-variant-numeric:tabular-nums; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .light { display:inline-flex; align-items:center; gap:6px; color:var(--dim); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); display:inline-block; }
  .dot.ok { background:var(--ok);} .dot.warn { background:var(--warn);} .dot.bad { background:var(--bad);}

  nav.tabs { display:flex; gap:2px; padding:0 16px; border-bottom:1px solid var(--line); background:#12141a; }
  nav.tabs button { background:none; border:none; color:var(--dim); font:inherit; font-weight:600; padding:10px 16px; cursor:pointer; border-bottom:2px solid transparent; }
  nav.tabs button:hover { color:var(--fg); }
  nav.tabs button.active { color:var(--fg); border-bottom-color:var(--accent); }

  main { display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-height:80px; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; }
  td.num, th.num { text-align:right; }
  .A { color:var(--ok); font-weight:600;} .B { color:var(--warn);} .C { color:var(--dim);}
  .pos { color:var(--ok);} .neg { color:var(--bad);}
  .rej { color:var(--dim); }
  .alerts { grid-column: 1 / -1; max-height: 320px; overflow:auto; }
  .urgent { color:var(--bad); font-weight:600;} .warning { color:var(--warn);} .info { color:var(--dim);}
  .muted { color:var(--dim); }
  .empty-note { color:var(--dim); font-style:italic; padding:8px 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  /* ---- performance tab ---- */
  .perf-controls { grid-column: 1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:20px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .perf-controls .group { display:flex; align-items:center; gap:8px; }
  .perf-controls label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .perf-controls input[type=date] { background:#0c0e12; color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:4px 8px; font:inherit; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { background:#0c0e12; color:var(--dim); border:none; padding:5px 12px; font:inherit; font-weight:600; cursor:pointer; }
  .seg button.active { background:var(--accent); color:#08111f; }

  .cards { grid-column: 1 / -1; display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .card .value { font-size:24px; font-weight:700; margin-top:4px; }

  .rollup-section { grid-column: 1 / -1; }
  #perf-chart { width:100%; height:140px; display:block; }
</style>
</head>
<body>
<header>
  <h1>tradedesk</h1>
  <span class="light"><span id="l-feed" class="dot"></span>feed</span>
  <span class="light"><span id="l-token" class="dot"></span>token</span>
  <span class="light"><span id="l-data" class="dot"></span>data <span id="data-date" class="muted"></span></span>
  <span class="light">regime <b id="regime">-</b></span>
  <span class="light">heat <b id="heat">-</b></span>
  <span class="light muted" id="updated"></span>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="today">Today</button>
  <button class="tab-btn" data-tab="performance">Performance</button>
</nav>

<main id="tab-today">
  <section><h2>Watchlist</h2><table id="watchlist"></table></section>
  <section><h2>Signals today</h2><table id="signals"></table></section>
  <section><h2>Open positions</h2><table id="positions"></table></section>
  <section><h2>Prices</h2><table id="prices"></table></section>
  <section class="alerts"><h2>Alerts</h2><table id="alerts"></table></section>
</main>

<main id="tab-performance" hidden>
  <div class="perf-controls">
    <div class="group">
      <label for="eod-date">End of day</label>
      <input type="date" id="eod-date">
    </div>
    <div class="group">
      <label>Rollup</label>
      <div class="seg" id="period-seg">
        <button data-period="week" class="active">Weekly</button>
        <button data-period="month">Monthly</button>
      </div>
    </div>
    <span class="muted" id="perf-note">paper book (PLAN.md 8) - simulates every triggered signal, NSE only</span>
  </div>

  <div class="cards">
    <div class="card"><div class="label">Closed today</div><div class="value" id="eod-closed">-</div></div>
    <div class="card"><div class="label">Net P&amp;L</div><div class="value" id="eod-pnl">-</div></div>
    <div class="card"><div class="label">Win rate</div><div class="value" id="eod-winrate">-</div></div>
    <div class="card"><div class="label">Expectancy</div><div class="value" id="eod-expectancy">-</div></div>
    <div class="card"><div class="label">Still open</div><div class="value" id="eod-open">-</div></div>
  </div>

  <section style="grid-column: 1 / -1;">
    <h2>Closed trades this day</h2>
    <table id="eod-trades"></table>
  </section>

  <section class="rollup-section">
    <h2><span id="rollup-title">Weekly performance</span></h2>
    <canvas id="perf-chart" width="1000" height="140"></canvas>
    <table id="rollup-table" style="margin-top:10px;"></table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (x, d=2) => (x === null || x === undefined) ? '-' : Number(x).toFixed(d);
const pct = (x) => (x === null || x === undefined) ? '-' : (Number(x)*100).toFixed(2) + '%';
const money = (x) => (x === null || x === undefined) ? '-' : (x>=0?'+':'') + Number(x).toFixed(0);
function light(id, status) { const el = $(id); el.className = 'dot ' + (status || ''); }
function rows(table, header, body) {
  table.innerHTML = '<tr>' + header.map(h => `<th class="${h.startsWith('#')?'num':''}">${h.replace('#','')}</th>`).join('') + '</tr>' + body.join('');
}

// ---------------------------------------------------------------- Today tab (SSE, unchanged)
function render(s) {
  const h = s.health || {};
  light('l-feed', h.feed === 'connected' ? (h.paused ? 'warn' : 'ok') : (h.feed === 'unknown' ? '' : 'bad'));
  light('l-token', h.token === 'ok' ? 'ok' : (h.token === 'unknown' ? '' : 'bad'));
  light('l-data', h.data_freshness ? 'ok' : '');
  $('data-date').textContent = h.data_freshness || '';
  $('regime').textContent = s.regime ? `${s.regime.regime} x${s.regime.size_multiplier}` : '-';
  $('heat').textContent = pct(s.heat_pct);
  $('updated').textContent = s.updated_at ? 'updated ' + s.updated_at.slice(11,19) : '';
  rows($('watchlist'), ['Sym','Setup','Grade','Trigger','#Stop','#T1','#T2','#Qty','#Risk','#Net R:R','Note'],
    (s.watchlist||[]).map(e => `<tr class="${e.rejected_for.length?'rej':''}"><td>${e.symbol}</td><td>${e.setup}</td><td class="${e.grade}">${e.grade} ${e.score}</td><td class="num">${fmt(e.trigger)}</td><td class="num">${fmt(e.stop)}</td><td class="num">${fmt(e.t1)}</td><td class="num">${fmt(e.t2)}</td><td class="num">${e.qty}</td><td class="num">${pct(e.risk_pct)}</td><td class="num">${fmt(e.net_rr_t2)}</td><td>${e.rejected_for.join('; ')}${e.chart?` <a href="/chart?path=${encodeURIComponent(e.chart)}" target="_blank">chart</a>`:''}</td></tr>`));
  rows($('signals'), ['Sym','State','#Trigger','#Stop','Last'],
    (s.signals||[]).map(t => `<tr><td>${t.symbol}</td><td class="${t.state==='triggered'?'urgent':''}">${t.state}</td><td class="num">${fmt(t.trigger)}</td><td class="num">${fmt(t.stop)}</td><td>${t.last}</td></tr>`));
  rows($('positions'), ['Sym','#Qty','#Entry','#Stop','#Price','#P&L','#R','#Sessions'],
    (s.positions||[]).map(p => `<tr><td>${p.symbol}${p.partial?' ½':''}</td><td class="num">${p.qty}</td><td class="num">${fmt(p.entry)}</td><td class="num">${fmt(p.stop)}</td><td class="num">${fmt(p.price)}</td><td class="num ${p.pnl>=0?'pos':'neg'}">${fmt(p.pnl,0)}</td><td class="num">${fmt(p.r,1)}</td><td class="num">${p.sessions}</td></tr>`));
  rows($('prices'), ['Code','#Last'],
    Object.entries(s.prices||{}).map(([c,p]) => `<tr><td>${c}</td><td class="num">${fmt(p)}</td></tr>`));
  rows($('alerts'), ['Time','Level','Kind','Message'],
    (s.alerts||[]).map(a => `<tr class="${a.level}"><td>${(a.at||'').slice(11,19)}</td><td>${a.level}</td><td>${a.kind}</td><td style="white-space:normal">${a.message}</td></tr>`));
}
function connect() {
  const es = new EventSource('/events');
  es.onmessage = (ev) => render(JSON.parse(ev.data));
  es.onerror = () => { light('l-feed','bad'); es.close(); setTimeout(connect, 3000); };
}
fetch('/api/state').then(r => r.json()).then(render).then(connect);

// ---------------------------------------------------------------- tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const target = btn.dataset.tab;
    $('tab-today').hidden = target !== 'today';
    $('tab-performance').hidden = target !== 'performance';
    if (target === 'performance') loadPerformance();
  });
});

// ---------------------------------------------------------------- Performance tab
let currentPeriod = 'week';

function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
$('eod-date').value = todayIso();
$('eod-date').addEventListener('change', loadEod);
document.querySelectorAll('#period-seg button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#period-seg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    $('rollup-title').textContent = (currentPeriod === 'week' ? 'Weekly' : 'Monthly') + ' performance';
    loadRollup();
  });
});

function loadPerformance() { loadEod(); loadRollup(); }

async function loadEod() {
  const on = $('eod-date').value;
  const r = await fetch('/api/eod?date=' + on);
  if (!r.ok) { $('perf-note').textContent = 'no journal configured for this dashboard'; return; }
  const d = await r.json();
  $('eod-closed').textContent = d.closed_count;
  $('eod-pnl').textContent = money(d.net_pnl);
  $('eod-pnl').className = 'value ' + (d.net_pnl >= 0 ? 'pos' : 'neg');
  $('eod-winrate').textContent = d.closed_count ? pct(d.win_rate) : '-';
  $('eod-expectancy').textContent = d.closed_count ? fmt(d.expectancy_r) + 'R' : '-';
  $('eod-open').textContent = d.open_positions + (d.open_symbols.length ? ' (' + d.open_symbols.join(', ') + ')' : '');
  if (!d.closed_trades.length) {
    $('eod-trades').innerHTML = '<tr><td class="empty-note">nothing closed this day</td></tr>';
  } else {
    rows($('eod-trades'), ['Sym','Setup','Entry','Exit','Reason','#Qty','#Net P&L','#R'],
      d.closed_trades.map(t => `<tr><td>${t.symbol}</td><td>${t.setup}</td><td>${t.entry_date}</td><td>${t.exit_date}</td><td>${t.exit_reason}</td><td class="num">${t.qty}</td><td class="num ${t.net_pnl>=0?'pos':'neg'}">${money(t.net_pnl)}</td><td class="num">${fmt(t.r_multiple,1)}</td></tr>`));
  }
}

async function loadRollup() {
  const r = await fetch('/api/performance?period=' + currentPeriod + '&n=16');
  if (!r.ok) return;
  const data = await r.json();
  if (!data.length) {
    $('rollup-table').innerHTML = '<tr><td class="empty-note">no paper trades resolved yet</td></tr>';
    drawChart([]);
    return;
  }
  rows($('rollup-table'), ['Period','#Trades','#Win rate','#Net P&L','#Expectancy'],
    data.map(row => `<tr><td>${row.period}</td><td class="num">${row.trades}</td><td class="num">${pct(row.win_rate)}</td><td class="num ${row.net_pnl>=0?'pos':'neg'}">${money(row.net_pnl)}</td><td class="num">${fmt(row.expectancy_r)}R</td></tr>`));
  drawChart(data);
}

function drawChart(data) {
  const canvas = $('perf-chart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!data.length) return;
  const values = data.map(d => d.net_pnl);
  const maxAbs = Math.max(1, ...values.map(v => Math.abs(v)));
  const zero = H / 2;
  const barW = W / data.length;
  ctx.strokeStyle = '#262a33';
  ctx.beginPath(); ctx.moveTo(0, zero); ctx.lineTo(W, zero); ctx.stroke();
  data.forEach((d, i) => {
    const h = (Math.abs(d.net_pnl) / maxAbs) * (H/2 - 10);
    const x = i * barW + barW * 0.15;
    const w = barW * 0.7;
    ctx.fillStyle = d.net_pnl >= 0 ? '#2ecc71' : '#e74c3c';
    if (d.net_pnl >= 0) ctx.fillRect(x, zero - h, w, h);
    else ctx.fillRect(x, zero, w, h);
  });
}
</script>
</body>
</html>
