<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tradedesk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --card:#171a21; --fg:#e6e6e6; --dim:#8a8f98; --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c; --line:#262a33; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, Segoe UI, sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .light { display:inline-flex; align-items:center; gap:6px; color:var(--dim); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); display:inline-block; }
  .dot.ok { background:var(--ok);} .dot.warn { background:var(--warn);} .dot.bad { background:var(--bad);}
  main { display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-height:80px; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; }
  td.num, th.num { text-align:right; }
  .A { color:var(--ok); font-weight:600;} .B { color:var(--warn);} .C { color:var(--dim);}
  .pos { color:var(--ok);} .neg { color:var(--bad);}
  .rej { color:var(--dim); }
  .alerts { grid-column: 1 / -1; max-height: 320px; overflow:auto; }
  .urgent { color:var(--bad); font-weight:600;} .warning { color:var(--warn);} .info { color:var(--dim);}
  .muted { color:var(--dim); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>tradedesk</h1>
  <span class="light"><span id="l-feed" class="dot"></span>feed</span>
  <span class="light"><span id="l-token" class="dot"></span>token</span>
  <span class="light"><span id="l-data" class="dot"></span>data <span id="data-date" class="muted"></span></span>
  <span class="light">regime <b id="regime">-</b></span>
  <span class="light">heat <b id="heat">-</b></span>
  <span class="light muted" id="updated"></span>
</header>
<main>
  <section><h2>Watchlist</h2><table id="watchlist"></table></section>
  <section><h2>Signals today</h2><table id="signals"></table></section>
  <section><h2>Open positions</h2><table id="positions"></table></section>
  <section><h2>Prices</h2><table id="prices"></table></section>
  <section class="alerts"><h2>Alerts</h2><table id="alerts"></table></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (x, d=2) => (x === null || x === undefined) ? '-' : Number(x).toFixed(d);
const pct = (x) => (x === null || x === undefined) ? '-' : (Number(x)*100).toFixed(2) + '%';
function light(id, status) { const el = $(id); el.className = 'dot ' + (status || ''); }
function rows(table, header, body) {
  table.innerHTML = '<tr>' + header.map(h => `<th class="${h.startsWith('#')?'num':''}">${h.replace('#','')}</th>`).join('') + '</tr>' + body.join('');
}
function render(s) {
  const h = s.health || {};
  light('l-feed', h.feed === 'connected' ? (h.paused ? 'warn' : 'ok') : (h.feed === 'unknown' ? '' : 'bad'));
  light('l-token', h.token === 'ok' ? 'ok' : (h.token === 'unknown' ? '' : 'bad'));
  light('l-data', h.data_freshness ? 'ok' : '');
  $('data-date').textContent = h.data_freshness || '';
  $('regime').textContent = s.regime ? `${s.regime.regime} x${s.regime.size_multiplier}` : '-';
  $('heat').textContent = pct(s.heat_pct);
  $('updated').textContent = s.updated_at ? 'updated ' + s.updated_at.slice(11,19) : '';
  rows($('watchlist'), ['Sym','Setup','Grade','Trigger','#Stop','#T1','#T2','#Qty','#Risk','#Net R:R','Note'],
    (s.watchlist||[]).map(e => `<tr class="${e.rejected_for.length?'rej':''}"><td>${e.symbol}</td><td>${e.setup}</td><td class="${e.grade}">${e.grade} ${e.score}</td><td class="num">${fmt(e.trigger)}</td><td class="num">${fmt(e.stop)}</td><td class="num">${fmt(e.t1)}</td><td class="num">${fmt(e.t2)}</td><td class="num">${e.qty}</td><td class="num">${pct(e.risk_pct)}</td><td class="num">${fmt(e.net_rr_t2)}</td><td>${e.rejected_for.join('; ')}${e.chart?` <a href="/chart?path=${encodeURIComponent(e.chart)}" target="_blank">chart</a>`:''}</td></tr>`));
  rows($('signals'), ['Sym','State','#Trigger','#Stop','Last'],
    (s.signals||[]).map(t => `<tr><td>${t.symbol}</td><td class="${t.state==='triggered'?'urgent':''}">${t.state}</td><td class="num">${fmt(t.trigger)}</td><td class="num">${fmt(t.stop)}</td><td>${t.last}</td></tr>`));
  rows($('positions'), ['Sym','#Qty','#Entry','#Stop','#Price','#P&L','#R','#Sessions'],
    (s.positions||[]).map(p => `<tr><td>${p.symbol}${p.partial?' ½':''}</td><td class="num">${p.qty}</td><td class="num">${fmt(p.entry)}</td><td class="num">${fmt(p.stop)}</td><td class="num">${fmt(p.price)}</td><td class="num ${p.pnl>=0?'pos':'neg'}">${fmt(p.pnl,0)}</td><td class="num">${fmt(p.r,1)}</td><td class="num">${p.sessions}</td></tr>`));
  rows($('prices'), ['Code','#Last'],
    Object.entries(s.prices||{}).map(([c,p]) => `<tr><td>${c}</td><td class="num">${fmt(p)}</td></tr>`));
  rows($('alerts'), ['Time','Level','Kind','Message'],
    (s.alerts||[]).map(a => `<tr class="${a.level}"><td>${(a.at||'').slice(11,19)}</td><td>${a.level}</td><td>${a.kind}</td><td style="white-space:normal">${a.message}</td></tr>`));
}
function connect() {
  const es = new EventSource('/events');
  es.onmessage = (ev) => render(JSON.parse(ev.data));
  es.onerror = () => { light('l-feed','bad'); es.close(); setTimeout(connect, 3000); };
}
fetch('/api/state').then(r => r.json()).then(render).then(connect);
</script>
</body>
</html>
