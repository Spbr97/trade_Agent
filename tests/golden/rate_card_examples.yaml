# Worked examples derived from the DOCUMENTED rate card (IND Pricing screenshots +
# config/risk.yaml), not from a real contract note or ledger entry.
#
# Why this file exists: the current fiscal year has no intraday trades at all (checked
# against the Equity Transactions Report for both FY24-25 and FY25-26 - every FY25-26 row
# matches an already-verified delivery note, and the FY24-25 round trips predate an
# unconfirmed plan change, so neither can be paisa-matched to a real bill yet). Until a
# real current-plan intraday trade exists, this is the best available check on the
# intraday-specific code paths in costs.py: STT on the sell leg only, stamp duty on the
# buy leg at the INTRADAY rate (not delivery), no DP charge.
#
# Numbers here were computed independently of costs.py (a standalone Decimal script
# re-typing the same documented percentages) - so this catches an implementation bug
# (wrong side, wrong rate, wrong rounding order) even though it cannot catch INDmoney
# quietly charging something the documentation doesn't mention. THIS IS NOT A SUBSTITUTE
# for a real note: tests/golden/contract_notes.yaml stays the authority once one exists,
# and pyproject.toml/CLAUDE.md should keep flagging the intraday gate as provisional
# until it does. Tolerance is tight (0.01) since these are hand-computed, not real-world
# rounding noise.

examples:
  - id: 2024-08-22-real-intraday-sell-leg
    trade_type: intraday
    qty: 8
    sell_price: 534.15
    note: >
      Real executed order (INDmoney order confirmation, NSE Order ID 1000000013361741,
      22 Aug 2024 10:26 AM, order value Rs 4273.20 = 8 x 534.15). Only the SELL leg is
      known - the confirmation has no buy price and no charge breakdown, so this checks
      the documented rate-card formula against a real qty/price, not a real bill. Predates
      the current pricing-plan confirmation window (see CLAUDE.md), so treat this as a
      real-data sanity check, not proof the plan matches.
    legs:
      sell:
        brokerage: 4.27
        stt: 1.00
        exchange_txn: 0.13
        ipft: 0.00
        sebi_fee: 0.00
        stamp_duty: 0.00
        gst: 0.79
        dp_charge: 0.00
        total: 6.19

  - id: rate-card-intraday-cap-both-legs
    trade_type: intraday
    qty: 100
    buy_price: 250.00
    sell_price: 253.00
    note: brokerage hits the Rs 5 cap on both legs (turnover x 0.1% > 5)
    legs:
      buy:
        brokerage: 5.00
        stt: 0.00
        exchange_txn: 0.77
        ipft: 0.03
        sebi_fee: 0.03
        stamp_duty: 1.00
        gst: 1.04
        dp_charge: 0.00
        total: 7.87
      sell:
        brokerage: 5.00
        stt: 6.00
        exchange_txn: 0.78
        ipft: 0.03
        sebi_fee: 0.03
        stamp_duty: 0.00
        gst: 1.05
        dp_charge: 0.00
        total: 12.89
    combined:
      total: 20.76

  - id: rate-card-intraday-mid-range-brokerage
