    buy_price: 100.00
    sell_price: 99.00
    note: turnover x 0.1% is below the Rs 2 floor, so brokerage clamps up to Rs 2 both legs
    legs:
      buy:
        brokerage: 2.00
        stt: 0.00
        exchange_txn: 0.02
        ipft: 0.00
