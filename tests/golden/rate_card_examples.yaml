      sell:
        brokerage: 2.94
        stt: 1.00
        exchange_txn: 0.09
        ipft: 0.00
        sebi_fee: 0.00
        stamp_duty: 0.00
        gst: 0.55
        dp_charge: 0.00
        total: 4.58
