# Real charge figures from INDmoney records (PLAN.md M1 "done when").
# Numbers only; never put the PDFs in the repo.
#
# Sources:
#   - Ledger Statement FY2025-26: each "BILL ENTRY" is the day's net obligation. Paired with
#     the fills in the Transactions Report, bill - traded value = that day's total charges.
#   - Tax P&L FY2024-25: charges by TYPE across all trades of the year (used to verify the
#     structure: GST base, rupee rounding of STT/stamp, IPFT rate) - see the notes at the end.
#
# Each entry is one trading day for one scrip. Give `legs.buy` / `legs.sell` with whatever
# lines you know; a leg with only `total` compares the leg total. Tolerances: 0.01 per line,
# 0.05 on totals; override with `tolerance:` when fills were split (STT rounds per fill).
#
# If an entry fails, fix the RATE in config/risk.yaml or the rounding rule in costs.py -
# never the expected number.

notes:
