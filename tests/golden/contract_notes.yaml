#   stamp 1   = only the Rs 3,798 delivery buy rounds up to Re 1          -> rupee rounding
#   exchange 3.98 => 0.00322% (NSE rate at the time; 0.00307% today per IND Pricing)
#   IPFT 0.15 == SEBI 0.15                                               -> IPFT = 0.0001%
