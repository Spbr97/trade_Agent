# Real charge figures transcribed from INDmoney contract notes (PLAN.md M1 "done when").
# Numbers only; never put the PDFs in the repo.
#
# Each entry is one round trip. Provide per-leg lines (`legs.buy` / `legs.sell`) when the
# note itemises each order, or `combined` when it only shows day totals (common for intraday,
# where both legs are on one note). Any charge line you omit is not compared — e.g. dp_charge
# usually appears on the demat ledger, not the contract note.
#
# Tolerances: 0.01 per line, 0.05 on totals (broker rounding order can differ from ours).
#
# Rates are pulled from config/risk.yaml. If a golden line fails, fix the RATE (or the
# rounding rule in costs.py) — never the expected number.

notes: []

